<script>
  /* =====================================================================
     Video halaman ini. ID ini HARUS sama dengan salah satu video di
     dalam array VIDEOS di bawah, dan array VIDEOS ini harus SAMA PERSIS
     dengan array VIDEOS di index.html.
     ===================================================================== */
  const CURRENT_VIDEO_ID = "1Ql5ThTmXjziyNnwdB05owd-cqRUtPyVv";

  const VIDEOS = [
    {
      judul: "Bercocok Tanam Indonesia Part 2",
      deskripsi: "",
      driveLink: "https://drive.google.com/file/d/1Ql5ThTmXjziyNnwdB05owd-cqRUtPyVv/view",
      tanggal: "11 Agustus 2026"
    },
    {
      judul: "Bercocok Tanam Indonesia Part 1",
      deskripsi: "",
      driveLink: "https://drive.google.com/file/d/1pKgliHlixiTt-AkONp4iCTNXQuCv5WjL/view",
      tanggal: "10 Agustus 2026"
    }
  ];

  const BANNER_ADS = [
    { key:'0e40ba1dba3a8f141432b1fab8600c41', width:300, height:250 },
    { key:'337feed2239192dfb25dbe9bd9125be5', width:160, height:300 },
    { key:'22d5eb295bd10a3b8cd2716d507e8a06', width:160, height:600 },
    { key:'f947d5407c089e1e084091836a5c5dd7', width:468, height:60  },
    { key:'d193d159f6ead21ab2fd4d86b506bc2e', width:728, height:90  }
  ];
  const NATIVE_AD_KEY = '98dcae4f009cb31f13e8cb6fe35988ec';

  function renderBannerAd(container, ad){
    const iframe = document.createElement('iframe');
    iframe.style.width = ad.width + 'px';
    iframe.style.height = ad.height + 'px';
    iframe.style.maxWidth = '100%';
    iframe.scrolling = 'no';
    container.appendChild(iframe);
    const doc = iframe.contentWindow.document;
    doc.open();
    doc.write(
      '<script>atOptions={"key":"' + ad.key + '","format":"iframe","height":' + ad.height + ',"width":' + ad.width + ',"params":{}};<\/script>' +
      '<script src="https://www.highperformanceformat.com/' + ad.key + '/invoke.js"><\/script>'
    );
    doc.close();
  }

  function renderNativeAd(container){
    const holder = document.createElement('div');
    holder.id = 'container-' + NATIVE_AD_KEY;
    container.appendChild(holder);
    const script = document.createElement('script');
    script.async = true;
    script.setAttribute('data-cfasync', 'false');
    script.src = 'https://pl30677989.effectivecpmnetwork.com/' + NATIVE_AD_KEY + '/invoke.js';
    container.appendChild(script);
  }

  let adRotationCounter = 0;
  function insertAdRow(container){
    const wrap = document.createElement('div');
    wrap.className = 'ad-row';
    wrap.innerHTML = '<span class="ad-label">Iklan</span>';
    container.appendChild(wrap);

    const rotationLength = BANNER_ADS.length + 1;
    const slot = adRotationCounter % rotationLength;
    adRotationCounter++;
    if(slot === BANNER_ADS.length){
      renderNativeAd(wrap);
    } else {
      renderBannerAd(wrap, BANNER_ADS[slot]);
    }
  }

  function extractDriveId(link){
    const patterns = [
      /\/d\/([a-zA-Z0-9_-]{10,})/,
      /[?&]id=([a-zA-Z0-9_-]{10,})/
    ];
    for(const p of patterns){
      const m = link.match(p);
      if(m) return m[1];
    }
    return link.trim();
  }

  function slugify(str){
    return str.toLowerCase().trim()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/(^-|-$)/g, '');
  }

  function makeVideoFrame(driveId, judul, autoLoad, linkToPage){
    const frame = document.createElement(autoLoad ? 'div' : 'a');
    frame.className = 'video-frame';
    if(!autoLoad) frame.href = linkToPage;
    if(autoLoad){
      frame.innerHTML = `<iframe src="https://drive.google.com/file/d/${driveId}/preview?autoplay=1" allow="autoplay" allowfullscreen></iframe>`;
    } else {
      frame.innerHTML = `
        <img class="video-thumb" src="https://drive.google.com/thumbnail?id=${driveId}&sz=w1000" alt="${judul}" loading="lazy">
        <div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      `;
    }
    return frame;
  }

  function init(){
    const targetIndex = VIDEOS.findIndex(v => extractDriveId(v.driveLink) === CURRENT_VIDEO_ID);
    if(targetIndex === -1) return;

    const v = VIDEOS[targetIndex];
    const episodeNumber = VIDEOS.length - targetIndex;

    const mainWrap = document.getElementById('main-video');
    const card = document.createElement('div');
    card.className = 'main-card';
    card.innerHTML = `
      <div class="card-meta">
        <span>EPISODE ${String(episodeNumber).padStart(2,'0')}</span>
        <span>${v.tanggal}</span>
      </div>
      <h2>${v.judul}</h2>
      ${v.deskripsi ? `<p class="desc">${v.deskripsi}</p>` : ''}
    `;
    const frame = makeVideoFrame(CURRENT_VIDEO_ID, v.judul, false, '#');
    frame.addEventListener('click', (e) => {
      e.preventDefault();
      const playing = makeVideoFrame(CURRENT_VIDEO_ID, v.judul, true, '#');
      frame.replaceWith(playing);
    });
    card.appendChild(frame);
    mainWrap.appendChild(card);

    insertAdRow(document.getElementById('ad-after-main'));

    const others = VIDEOS.filter((_, i) => i !== targetIndex);
    if(others.length){
      document.getElementById('other-heading').style.display = 'block';
      const otherWrap = document.getElementById('other-videos');
      others.forEach(o => {
        const oId = extractDriveId(o.driveLink);
        const oPage = slugify(o.judul) + '.html';
        const oCard = document.createElement('div');
        oCard.className = 'other-card';
        const oFrame = makeVideoFrame(oId, o.judul, false, oPage);
        oCard.appendChild(oFrame);
        const meta = document.createElement('div');
        meta.className = 'card-meta';
        meta.style.marginTop = '10px';
        meta.innerHTML = `<span>${o.tanggal}</span>`;
        oCard.appendChild(meta);
        const h3 = document.createElement('h3');
        h3.innerHTML = `<a href="${oPage}">${o.judul}</a>`;
        oCard.appendChild(h3);
        otherWrap.appendChild(oCard);

        insertAdRow(otherWrap);
      });
    }
  }

  init();
  renderBannerAd(document.getElementById('ad-top-728x90'), { key:'d193d159f6ead21ab2fd4d86b506bc2e', width:728, height:90 });
  renderBannerAd(document.getElementById('ad-top-320x50'), { key:'e27a459a9e6188b68843a4fa32f52041', width:320, height:50 });
</script>
